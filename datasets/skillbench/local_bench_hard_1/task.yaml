version: "2.0"

messages:
  - role: user
    content:
      - type: text
        text: "请帮我系统调研 Qwen3 Next 所使用的线性注意力机制，并与传统的注意力机制对比，把调研结果保存到 linear_attention_research.md 文件中。"

metadata:
  task_id: "local_bench_hard_1"
  author: "panxuchen"
  labels:
    capabilities:
      - "Local_Remote_Collaboration"
      - "Tool_Usage"
    difficulty: "hard"
    step_type: "ReAct"
    hop_count: "L2"
    persona: "Default_Assistant"
    style_tone: "Professional"
    sysprompt_dependency: "None"

copaw:
  required_tools:
    - "read_file"
    - "write_file"
    - "execute_shell_command"
    - "list_agents"
    - "chat_with_agent"
  required_skills:
    - "make_plan"

evaluation:
  eval_type: "hybrid"
  test_script: "tests/test.sh"
  dimensions:
    session_check: false
    llm_judge: true
  inputs:
    answer: ""
  llm_judge:
    grader_type:
      - "CorrectnessGrader"
    model: "qwen3-32b"
    threshold: 4
    language: "zh"
  env:
    required:
      - "DASHSCOPE_API_KEY"

setup: []